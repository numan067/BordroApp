<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2026 Ücret Hesaplama</title>
    
    <style>
        :root {
            --primary: #1e293b;
            --accent: #f59e0b;
            --bg: #f1f5f9;
            --card: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        /* Ana Başlık */
        .main-title {
            text-align: center;
            color: var(--primary);
            font-size: 24px;
            font-weight: 800;
            margin: 20px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Buton Grubu */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }

        .btn {
            display: block;
            padding: 18px;
            border-radius: 15px;
            text-align: center;
            text-decoration: none;
            font-weight: 700;
            font-size: 16px;
            color: white;
            transition: transform 0.1s, background-color 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            border: none;
            cursor: pointer;
        }

        .btn-maas { background-color: #2563eb; }
        .btn-maas:hover { background-color: #1d4ed8; }
        
        .btn-fark { background-color: #8b5cf6; }
        .btn-fark:hover { background-color: #7c3aed; }
        
        .btn-sosyal { background-color: #10b981; }
        .btn-sosyal:hover { background-color: #059669; }
        
        .btn:active { transform: scale(0.98); }

        /* Duyuru Panosu (Fotoğraf Alanı) */
        .duyuru-container {
            width: 100%;
            margin-bottom: 25px;
            line-height: 0;
        }

        .duyuru-img {
            width: 100%;
            height: auto;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.08);
        }

        /* Enflasyon Kartı */
        .stats-card {
            background: var(--card);
            border-radius: 25px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
        }

        .stats-header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 10px;
        }

        .stats-header h2 {
            margin: 0;
            color: var(--primary);
            font-size: 17px;
            font-weight: 700;
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 5px;
            border-bottom: 1px solid #f8fafc;
        }

        .data-row span:first-child { color: #64748b; font-size: 15px; }
        .data-row span:last-child { font-weight: 700; color: var(--primary); }

        /* Bileşik Toplam Kutusu */
        .total-box {
            margin-top: 15px;
            background: #fffcf0;
            border: 2px dashed var(--accent);
            border-radius: 15px;
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .total-label {
            display: flex;
            flex-direction: column;
        }

        .total-label .title {
            color: #854d0e;
            font-weight: 800;
            font-size: 13px;
            letter-spacing: 0.5px;
        }

        .total-label .subtitle {
            color: #b45309;
            font-size: 11px;
            font-weight: 600;
        }

        .total-val { 
            color: #854d0e; 
            font-weight: 900; 
            font-size: 22px; 
        }
        
        /* Footer Bölümü */
        .footer { 
            text-align: center; 
            color: #94a3b8; 
            font-size: 12px; 
            margin-top: 30px; 
            line-height: 1.8;
        }

        .footer a {
            color: #64748b;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }
        
        .footer a:hover {
            color: var(--primary);
        }
    </style>
</head>
<body>

<div class="container">
    
    <h1 class="main-title">2026 ÜCRET HESAPLAMA</h1>

    <div class="btn-group">
        <a href="hesapla.html" class="btn btn-maas">Maaş Hesaplama</a>
        <a href="fark.html" class="btn btn-fark">Fark Hesaplama</a>
        <a href="sosyal.html" class="btn btn-sosyal">Sosyal Haklar</a>
    </div>

    <div class="duyuru-container">
        <img src="duyuru.jpg" alt="Duyuru Panosu" class="duyuru-img">
    </div>

    <div class="stats-card">
        <div class="stats-header">
            <span style="margin-right: 10px; font-size: 20px;">📊</span>
            <h2>2026 Enflasyon Verileri</h2>
        </div>

        <div class="data-row"><span>Ocak 2026</span><span>%4,84</span></div>
        <div class="data-row"><span>Şubat 2026</span><span>%2,96</span></div>
        <div class="data-row"><span>Mart 2026</span><span>%1,94</span></div>
        <div class="data-row"><span>Nisan 2026</span><span>%4,18</span></div>

        <div class="total-box">
            <div class="total-label">
                <span class="title">4 AYLIK TOPLAM</span>
                <span class="subtitle">(BİLEŞİK ENFLASYON)</span>
            </div>
            <span class="total-val" id="bilesik-sonuc">%14,64</span>
        </div>
    </div>

    <div class="footer">
        © 2026 Numan Özdemir - Bordro Sistemleri<br>
        <a href="tes.html">💬 Görüş ve Önerilerinizi İletin</a>
    </div>

</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        // İleride tablonun dinamik hesaplanması veya diğer sayfalara 
        // veri aktarımı için kullanabileceğin veri dizisi:
        const enflasyonVerileri2026 = [4.84, 2.96, 1.94, 4.18];

        // Gerekirse bileşik kümülatif hesabı tarayıcı tarafında doğrulamak için:
        let kume = 1;
        enflasyonVerileri2026.forEach(function(oran) {
            kume *= (1 + (oran / 100));
        });
        let nihaiSonuc = ((kume - 1) * 100).toFixed(2);
        
        // Sistemdeki veriyi doğrula ve formata uygun yazdır (Virgül kullanarak)
        const formatliSonuc = "%" + nihaiSonuc.replace('.', ',');
        document.getElementById("bilesik-sonuc").innerText = formatliSonuc;
        
        console.log("2026 İlk 4 Aylık Enflasyon Datası Başarıyla Yüklendi: " + formatliSonuc);
    });
</script>

</body>
</html>
